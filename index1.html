<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 Authentication - Assignment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Consolas', monospace;
            margin: 0;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #1a1a2e 100%);
            background-size: 400% 400%;
            animation: gradient-shift 15s ease infinite;
            display: flex;
            position: relative;
            overflow-x: hidden;
            min-height: 100vh;
        }

        @keyframes gradient-shift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0, 255, 136, 0.03) 2px, rgba(0, 255, 136, 0.03) 4px),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 255, 136, 0.03) 2px, rgba(0, 255, 136, 0.03) 4px);
            pointer-events: none;
            z-index: 0;
            animation: grid-move 20s linear infinite;
        }

        @keyframes grid-move {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(20px, 20px);
            }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(2px 2px at 20% 30%, rgba(0, 255, 136, 0.3), transparent),
                radial-gradient(2px 2px at 60% 70%, rgba(0, 212, 255, 0.3), transparent),
                radial-gradient(2px 2px at 50% 50%, rgba(162, 155, 254, 0.3), transparent),
                radial-gradient(2px 2px at 80% 10%, rgba(0, 255, 136, 0.3), transparent);
            background-size: 200px 200px, 300px 300px, 250px 250px, 350px 350px;
            animation: particles-float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes particles-float {

            0%,
            100% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(10px, -10px);
            }

            50% {
                transform: translate(-5px, 5px);
            }

            75% {
                transform: translate(5px, 10px);
            }
        }

        .container {
            display: flex;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 240px;
            background: linear-gradient(180deg, rgba(26, 26, 46, 0.95) 0%, rgba(30, 30, 50, 0.95) 100%);
            backdrop-filter: blur(10px);
            position: fixed;
            height: 100vh;
            padding: 30px 20px;
            box-shadow: 4px 0 30px rgba(0, 255, 136, 0.2);
            transform: translateX(-100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            border-right: 2px solid rgba(0, 255, 136, 0.3);
            overflow-y: auto;
            left: 0;
            top: 0;
        }

        .sidebar::before {
            content: '🔐 SECURE NAVIGATION';
            display: block;
            color: #00ff88;
            font-size: 0.75em;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 255, 136, 0.3);
            text-align: center;
            animation: text-glow 2s ease-in-out infinite;
        }

        @keyframes text-glow {

            0%,
            100% {
                text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            }

            50% {
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            }
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin-bottom: 12px;
            position: relative;
            animation: slide-in 0.5s ease-out backwards;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .sidebar ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: #00ff88;
            opacity: 0;
            transition: all 0.3s;
            font-size: 1.2em;
        }

        .sidebar ul li:hover::before {
            opacity: 1;
            left: -15px;
        }

        .sidebar ul li a {
            text-decoration: none;
            color: #00d4aa;
            display: block;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            font-weight: 500;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
        }

        .sidebar ul li a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.3), transparent);
            transition: left 0.6s;
        }

        .sidebar ul li a:hover::before {
            left: 100%;
        }

        .sidebar ul li a:hover {
            background: rgba(0, 255, 136, 0.15);
            border-color: rgba(0, 255, 136, 0.4);
            transform: translateX(8px);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
            color: #00ff88;
        }

        .sidebar ul li a.active {
            background: linear-gradient(135deg, #00ff88 0%, #00d4aa 100%);
            color: #0a0e27;
            font-weight: bold;
            border-color: #00ff88;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
            animation: pulse-active 2s ease-in-out infinite;
        }

        @keyframes pulse-active {

            0%,
            100% {
                box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
                transform: scale(1);
            }

            50% {
                box-shadow: 0 0 35px rgba(0, 255, 136, 0.8);
                transform: scale(1.02);
            }
        }

        .content-area {
            margin-left: 0;
            padding: 30px;
            flex-grow: 1;
            background-color: transparent;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 100vh;
        }

        .content-area.shifted {
            margin-left: 240px;
        }

        .menu-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #00ff88 0%, #00d4aa 100%);
            color: #0a0e27;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 1001;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.5);
            border: 2px solid rgba(0, 255, 136, 0.3);
            width: 50px;
            height: 50px;
            line-height: 1;
        }

        .menu-toggle:hover {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 6px 30px rgba(0, 255, 136, 0.7);
        }

        .menu-toggle:active {
            transform: scale(0.98);
        }

        @media (min-width: 1024px) {
            .sidebar {
                transform: translateX(0) !important;
            }

            .content-area {
                margin-left: 240px !important;
            }

            .menu-toggle {
                display: none !important;
            }
        }

        .breadcrumb {
            font-size: 0.9em;
            color: #00d4aa;
            margin-bottom: 25px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
            animation: fade-in 0.8s ease-out;
            letter-spacing: 0.5px;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-title {
            color: #ffaa00;
            margin-bottom: 35px;
            font-size: 2.5em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            animation: title-entrance 1s ease-out, title-glow 3s ease-in-out infinite;
            position: relative;
            padding-bottom: 20px;
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, #00ff88, transparent);
            animation: underline-expand 1.2s ease-out;
        }

        @keyframes title-entrance {
            from {
                opacity: 0;
                transform: translateY(-30px);
                letter-spacing: 8px;
            }

            to {
                opacity: 1;
                transform: translateY(0);
                letter-spacing: 2px;
            }
        }

        @keyframes title-glow {

            0%,
            100% {
                text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            }

            50% {
                text-shadow: 0 0 30px rgba(0, 255, 136, 0.9);
            }
        }

        @keyframes underline-expand {
            from {
                width: 0;
            }

            to {
                width: 100px;
            }
        }

        .card {
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            animation: card-entrance 0.6s ease-out backwards;
        }

        @keyframes card-entrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
            transition: left 0.8s;
        }

        .card:hover::before {
            left: 100%;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 48px rgba(0, 255, 136, 0.4);
            border-color: rgba(0, 255, 136, 0.6);
        }

        .card h2 {
            color: #00ff88;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8em;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0, 255, 136, 0.3);
            position: relative;
        }

        .card h2::before {
            content: '🔒 ';
            font-size: 0.9em;
            margin-right: 8px;
        }

        .card p,
        .card li {
            color: #00d4aa;
            line-height: 1.8;
            font-size: 1.05em;
            margin-bottom: 12px;
        }

        .card ul {
            margin-left: 20px;
            padding-left: 20px;
        }

        .card ul li {
            position: relative;
            padding-left: 10px;
            margin-bottom: 15px;
        }

        .card ul li::marker {
            color: #00ff88;
            content: '▸ ';
        }

        .card ul li:hover {
            color: #00ff88;
            transform: translateX(5px);
            transition: all 0.3s ease;
        }

        ::-webkit-scrollbar {
            width: 12px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(26, 26, 46, 0.5);
            border-radius: 6px;
        }
